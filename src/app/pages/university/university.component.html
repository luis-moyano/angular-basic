

<div class="container py-5">
  <div class="mb-4">
    <h2 class="fw-semibold">Universities</h2>
    <p class="text-muted">Search universities by country</p>
  </div>

    <div class="row g-2 mb-4">
      <div class="col-sm-8 col-md-5">
        <input
          type="text"
          class="form-control"
          placeholder="Enter country (e.g. Chile)"
          [(ngModel)]="country"
          (keyup.enter)="getUniversities()"
        />
      </div>
      <div class="col-auto">
        <button class="btn btn-primary" (click)="getUniversities()">Search</button>
      </div>
    </div>

    @if ( universities.length > 0) {
    <div class="table-responsive">
      <table class="table table-borderless align-middle">
        <thead class="border-bottom">
          <tr class="text-muted small text-uppercase">
            <th scope="col">#</th>
            <th scope="col">Name</th>
            <th scope="col">Domain</th>
            <th scope="col">Website</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let university of universities; let i = index" class="border-bottom">
            <td class="text-muted">{{ i + 1 }}</td>
            <td class="fw-medium">{{ university.name }}</td>
            <td class="text-muted">{{ university.domains?.[0] ?? '—' }}</td>
            <td>
              <a
                *ngIf="university.web_pages?.[0]"
                [href]="university.web_pages[0]"
                target="_blank"
                rel="noopener noreferrer"
                class="text-decoration-none text-primary small"
              >{{ university.web_pages[0] }}</a>
              <span *ngIf="!university.web_pages?.[0]" class="text-muted">—</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  }
</div>
